name: Draft Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft-release:
    name: Draft release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CMAKE_VERSION="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9A-Za-z.+-]\+\).*/\1/p' CMakeLists.txt | head -n1)"
          APP_VERSION="$(sed -n 's/.*setApplicationVersion(QStringLiteral("\([^"]\+\)").*/\1/p' src/main.cpp | head -n1)"
          META_VERSION="$(sed -n 's/.*<release version="\([^"]\+\)".*/\1/p' resources/io.github.juangiler.thunderbird-tray.metainfo.xml | head -n1)"
          echo "tag=$TAG cmake=$CMAKE_VERSION app=$APP_VERSION metainfo=$META_VERSION"
          if [ "$CMAKE_VERSION" != "$VERSION" ] || [ "$APP_VERSION" != "$VERSION" ] || [ "$META_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match project versions (expected $VERSION). Run scripts/bump-version.sh $VERSION and retag."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            qml6-module-org-kde-kirigami \
            libkf6kirigami-dev kirigami-addons-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Prepare dist archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          cmake --install build --prefix "dist/thunderbird-tray-${TAG}"
          tar -C dist -czf "thunderbird-tray-${TAG}-linux-x86_64.tar.gz" "thunderbird-tray-${TAG}"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "$TAG" --generate-notes
            gh release upload "$TAG" "thunderbird-tray-${TAG}-linux-x86_64.tar.gz" --clobber
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --generate-notes \
              "thunderbird-tray-${TAG}-linux-x86_64.tar.gz"
          fi
